<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحان اللغة الإنجليزية - نموذج B</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="container">
        <h2>تسجيل دخول الطالب - نموذج B</h2>
        <form id="startForm">
            <div class="form-group">
                <label for="studentName">اسم الطالب:</label>
                <input type="text" id="studentName" required placeholder="أدخل اسمك رباعي">
            </div>
            <div class="form-group">
                <label for="parentPhone">رقم هاتف ولي الأمر:</label>
                <input type="tel" id="parentPhone" required placeholder="01xxxxxxxxox">
            </div>
            <button type="submit" class="btn">ابدأ الامتحان</button>
        </form>
    </div>

    <!-- شاشة الامتحان -->
    <div id="examScreen" class="container" style="display: none;">
        <div id="timerBox" class="timer-box">
            <span>الوقت المتبقي:</span>
            <span id="timer">75:00</span>
        </div>
        
        <form id="examForm">
            <div id="questionsContainer"></div>
            <button type="submit" class="btn submit-btn">إنهاء وتسليم الامتحان</button>
        </form>
    </div>

    <!-- شاشة انتهاء التسليم -->
    <div id="submittedScreen" class="container" style="display: none; text-align: center;">
        <h2>تم تسليم الامتحان بنجاح!</h2>
        <p>شكراً لك، تم حفظ إجاباتك في قاعدة البيانات بنجاح.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
